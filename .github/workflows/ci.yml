name: NexusLogix CI

on:
  push:
    branches: [ main, develop, 'feature/**', 'release/**' ]
  pull_request:
    branches: [ main, develop, 'release/**' ]

jobs:
  backend-test-and-build:
    name: Test & Build Backend (Spring Boot)
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: nexuslogix_wms
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 26 (Oracle)
        uses: actions/setup-java@v4
        with:
          java-version: '26'
          distribution: 'oracle'
          cache: maven

      - name: Grant execute permission for mvnw
        run: chmod +x mvnw

      - name: Seed MySQL Database
        run: |
          mysql -h 127.0.0.1 -P 3306 -u root -proot nexuslogix_wms < database/schema.sql

      - name: Run Unit Tests with Maven
        run: ./mvnw clean test -B

      - name: Package Application (.jar)
        run: ./mvnw package -DskipTests -B

  frontend-build:
    name: Build Frontend (React + Vite)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Build Production Bundle
        working-directory: ./frontend
        run: npm run build
